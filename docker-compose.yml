version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always # if the vm reboots it will automatically restart
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gateway_telemetry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gateway_telemetry"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cache:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always # if the vm reboots it will automatically restart
    # Removed the redis volume completely as discussed!
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi_gateway:
    build:
      context: .
      dockerfile: dockerfile
    container_name: ai_gateway # FIXED: Moved left!
    restart: always 
    ports:
      - "8000:8000" 
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=gateway_telemetry
      - REDIS_URL=redis://cache:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  streamlit_dashboard:
    build:
      context: .
      dockerfile: dockerfile.streamlit
    container_name: streamlit_dashboard # FIXED: Moved left!
    restart: always 
    ports:
      - "8501:8501" 
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=gateway_telemetry
      - GATEWAY_URL=http://fastapi_gateway:8000/v1/chat/completions
    depends_on: 
      - db
      - fastapi_gateway

volumes:
  pgdata: